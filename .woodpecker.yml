when:
  - event: [push, pull_request]
  - event: manual

steps:
  - name: submodules
    image: git.firka.app/firka/firka-builder:latest
    commands:
      - git submodule update --init --recursive

  - name: secrets
    image: git.firka.app/firka/firka-builder:latest
    environment:
      UPLOAD_KEYSTORE_B64:
        from_secret: upload_keystore_b64
      KEYSTORE_PROPERTIES_B64:
        from_secret: keystore_properties_b64
    commands:
      - echo "$UPLOAD_KEYSTORE_B64" | base64 -d > secrets/upload-keystore.jks
      - echo "$KEYSTORE_PROPERTIES_B64" | base64 -d > secrets/keystore.properties

  # Each step runs in a fresh container from the builder image -- only the
  # workspace volume is shared between them. Pointing PUB_CACHE at a
  # workspace-local dir (instead of the image's default /root/.pub-cache)
  # is what lets `flutter pub get`'s downloads survive into later steps.
  - name: dependencies
    image: git.firka.app/firka/firka-builder:latest
    commands:
      - export PUB_CACHE="$CI_WORKSPACE/.pub-cache"
      - cd firka
      - flutter pub get

  - name: codegen
    image: git.firka.app/firka/firka-builder:latest
    commands:
      - export PUB_CACHE="$CI_WORKSPACE/.pub-cache"
      - cd firka
      - dart run scripts/codegen.dart

  - name: clone-mock-kreta-server
    image: git.firka.app/firka/firka-builder:latest
    environment:
      GITEA_USERNAME:
        from_secret: gitea_username
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - pwd
      # The heredoc uses a quoted delimiter so $GITEA_USERNAME/$GITEA_TOKEN
      # are written to the script literally, not expanded here -- keeps the
      # secret values out of this (traced) command's expanded output.
      - |
        cat > /tmp/write_netrc.sh <<'NETRC_SCRIPT'
        printf 'machine git.firka.app\nlogin %s\npassword %s\n' "$GITEA_USERNAME" "$GITEA_TOKEN" > "$HOME/.netrc"
        chmod 600 "$HOME/.netrc"
        NETRC_SCRIPT
      # Runs as an untraced child shell, so the expansion above never hits the log.
      - sh /tmp/write_netrc.sh
      - git clone --depth 1 https://git.firka.app/firka/mock_kreta_server.git mock_kreta_server
      - rm -f /tmp/write_netrc.sh "$HOME/.netrc"

  - name: build-mock-kreta-server
    image: golang:1.26
    commands:
      - cd mock_kreta_server
      - go build -o ../mock_kreta_server_bin .

  # Runs the mock server in the background and exercises kreta_api's DTOs
  # against its real wire format, catching drift between the two repos.
  - name: kreta-api-mock-server-tests
    image: git.firka.app/firka/firka-builder:latest
    commands:
      - export PUB_CACHE="$CI_WORKSPACE/.pub-cache"
      - ./mock_kreta_server_bin -addr :8090 -data mock_kreta_server/data.json &
      - sleep 1
      - cd kreta_api
      - dart pub get
      - MOCK_KRETA_SERVER_URL=http://127.0.0.1:8090 dart test

  - name: build-release
    image: git.firka.app/firka/firka-builder:latest
    when:
      - branch: main
    commands:
      - export PUB_CACHE="$CI_WORKSPACE/.pub-cache"
      - cd firka
      - flutter build appbundle --release

  - name: build-debug
    image: git.firka.app/firka/firka-builder:latest
    when:
      - branch:
          exclude: main
    commands:
      - export PUB_CACHE="$CI_WORKSPACE/.pub-cache"
      - cd firka
      - flutter build apk --debug --split-per-abi

  - name: publish-release
    image: woodpeckercommunity/plugin-gitea-package:latest
    pull: true
    when:
      - branch: main
    settings:
      user:
        from_secret: gitea_username
      password:
        from_secret: gitea_token
      owner: firka
      package_name: firka
      package_version: ${CI_COMMIT_SHA}
      file_source: ./firka/build/app/outputs/bundle/release/app-release.aab
      file_name: app-release.aab
      update: 'true'

  - name: publish-debug-arm64-v8a
    image: woodpeckercommunity/plugin-gitea-package:latest
    pull: true
    when:
      - branch:
          exclude: main
    settings:
      user:
        from_secret: gitea_username
      password:
        from_secret: gitea_token
      owner: firka
      package_name: firka
      package_version: ${CI_COMMIT_SHA}
      file_source: ./firka/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
      file_name: app-arm64-v8a-debug.apk
      update: 'true'

  - name: publish-debug-armeabi-v7a
    image: woodpeckercommunity/plugin-gitea-package:latest
    pull: true
    when:
      - branch:
          exclude: main
    settings:
      user:
        from_secret: gitea_username
      password:
        from_secret: gitea_token
      owner: firka
      package_name: firka
      package_version: ${CI_COMMIT_SHA}
      file_source: ./firka/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
      file_name: app-armeabi-v7a-debug.apk
      update: 'true'

  - name: publish-debug-x86_64
    image: woodpeckercommunity/plugin-gitea-package:latest
    pull: true
    when:
      - branch:
          exclude: main
    settings:
      user:
        from_secret: gitea_username
      password:
        from_secret: gitea_token
      owner: firka
      package_name: firka
      package_version: ${CI_COMMIT_SHA}
      file_source: ./firka/build/app/outputs/flutter-apk/app-x86_64-debug.apk
      file_name: app-x86_64-debug.apk
      update: 'true'
